name: CI

on:
  push:
    branches: ["main", "database"]
  pull_request:

jobs:
  backend:
    name: Backend (Flask)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Import sanity check
        run: |
          python -c "import app; print('app.py imports cleanly')"

      - name: Alembic migration check (fresh SQLite)
        run: |
          rm -f app.db
          python -m alembic upgrade head
          python -c "
          import sqlite3
          conn = sqlite3.connect('app.db')
          tables = {r[0] for r in conn.execute(\"SELECT name FROM sqlite_master WHERE type='table'\")}
          assert {'users', 'documents', 'user_events', 'password_reset_tokens'}.issubset(tables), tables
          print('migrations produce expected schema:', tables)
          "

      - name: Test suite (pytest)
        run: |
          rm -f app.db
          python -m pytest -v

  frontend:
    name: Frontend (tests + Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test suite (Vitest)
        run: npm run test

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build