# DigitalOcean App Platform spec.
# Use this either by pasting it in when creating the app (App Platform
# supports "Edit as YAML"), or via `doctl apps create --spec app.yaml`.
# Replace every <PLACEHOLDER> before using.
name: itti-website

services:
  - name: backend
    dockerfile_path: server/Dockerfile
    source_dir: /
    github:
      repo: <your-github-username>/itti_website
      branch: database
      deploy_on_push: true
    http_port: 8080
    instance_size_slug: basic-xxs
    instance_count: 1
    routes:
      - path: /api
    envs:
      - key: FLASK_ENV
        value: production
      - key: FLASK_SECRET_KEY
        type: SECRET
        value: "<PLACEHOLDER - generate one with: python3 -c 'import secrets; print(secrets.token_hex(32))'>"
      - key: CLIENT_ORIGIN
        value: ${APP_URL}
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
      - key: GOOGLE_CLIENT_ID
        value: <PLACEHOLDER>
      - key: EMAIL_BACKEND
        value: brevo_api
      - key: BREVO_API_KEY
        type: SECRET
        value: <PLACEHOLDER - Brevo API key (Account name -> SMTP & API -> API Keys)>
      - key: BREVO_FROM_EMAIL
        value: <PLACEHOLDER - e.g. noreply@yourdomain.org, must be a verified Brevo sender>
      - key: BREVO_FROM_NAME
        value: International Truth & Trauma Institute
      - key: STRIPE_SECRET_KEY
        type: SECRET
        value: <PLACEHOLDER, if using donations>
      - key: STRIPE_WEBHOOK_SECRET
        type: SECRET
        value: <PLACEHOLDER, if using donations>
      # Uploaded content (fellow photos, report files/cover images) MUST
      # NOT use the default STORAGE_BACKEND=local here. App Platform
      # rebuilds this service's container from a fresh image on every
      # deploy (deploy_on_push: true above), so anything written to
      # local disk after the container starts - i.e. every fellow photo
      # or report uploaded through the live admin/publisher UI - is gone
      # the next time it redeploys, while the database still points at
      # it. The symptom is a broken image and, until storage.py's
      # get_file_response() was made to 404 cleanly on a missing file, a
      # raw 500 "internal server error" from GET /api/fellows/<id>/photo
      # (and the equivalent report file/image routes).
      #
      # Fix: point this at an S3-compatible bucket instead - the same
      # DigitalOcean Spaces mechanism used for the frontend bucket
      # below, but a separate (private) bucket, since these files don't
      # need to be public - get_file_response() serves them via a
      # short-lived presigned URL either way. See docs/DEPLOYMENT.md,
      # "Persistent storage for uploads" for one-time setup.
      - key: STORAGE_BACKEND
        value: s3
      - key: STORAGE_S3_BUCKET
        value: <PLACEHOLDER - e.g. itti-uploads>
      - key: STORAGE_S3_ENDPOINT_URL
        value: <PLACEHOLDER - e.g. https://nyc3.digitaloceanspaces.com>
      - key: AWS_ACCESS_KEY_ID
        type: SECRET
        value: <PLACEHOLDER - Spaces access key, same one used for the frontend bucket or a separate pair>
      - key: AWS_SECRET_ACCESS_KEY
        type: SECRET
        value: <PLACEHOLDER - Spaces secret key>

# Frontend is NOT built by App Platform. It's built on GitHub Actions
# (.github/workflows/deploy-frontend.yml) and synced straight to a
# DigitalOcean Spaces bucket fronted by DO's CDN - see
# docs/DEPLOYMENT.md for one-time setup. This keeps `npm run build`
# off both the backend's basic-xxs instance and App Platform's own
# static-site build step.
static_sites: []

databases:
  - name: db
    engine: PG
    version: "16"
    production: true